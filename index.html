<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121826" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voyage">
<title>Voyage · Planejamento de viagem</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar glass">
    <div class="tb-text">
      <span class="eyebrow" id="tb-eyebrow">Voyage</span>
      <h1 id="tb-title">Resumo</h1>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="btn-rate" aria-label="Cotação">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
        <span class="rate-chip" id="rate-chip">—</span>
      </button>
      <span id="sem-rede" class="chip off-chip" hidden title="Sem internet — o app continua funcionando">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 4-2.5M19 13a10 10 0 0 0-7-2.9M2 9.5A15 15 0 0 1 7 6.4M22 9.5a15 15 0 0 0-9.5-3.4"/></svg>
        offline
      </span>
      <button class="icon-btn" id="btn-config" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <button class="fab fab-2" id="fab-ocr" hidden aria-label="Ler nota com a câmera">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>
  </button>
  <button class="fab" id="fab" hidden aria-label="Adicionar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar glass" id="tabbar">
    <a href="#/resumo" data-tab="resumo">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg><span>Resumo</span>
    </a>
    <a href="#/plano" data-tab="plano">
      <svg viewBox="0 0 24 24"><path d="M4.5 12.5l3 3 7-7"/><path d="M13 18h7M13 7h7"/></svg><span>Plano</span>
    </a>
    <a href="#/agenda" data-tab="agenda">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg><span>Agenda</span>
    </a>
    <a href="#/gastos" data-tab="gastos">
      <svg viewBox="0 0 24 24"><path d="M3.5 7.5h17v11h-17z" /><path d="M3.5 11h17M7 15h3"/></svg><span>Gastos</span>
    </a>
    <a href="#/acerto" data-tab="acerto">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 9h5l-2-2M21 14h-5l2 2"/></svg><span>Acerto</span>
    </a>
    <a href="#/mala" data-tab="mala">
      <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M9 8V5.5h6V8M12 11v6"/></svg><span>Mala</span>
    </a>
  </nav>

  <div id="layer"></div>

  <script src="js/store.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/split.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/view-resumo.js"></script>
  <script src="js/view-plano.js"></script>
  <script src="js/view-mala.js"></script>
  <script src="js/view-agenda.js"></script>
  <script src="js/view-gastos.js"></script>
  <script src="js/view-acerto.js"></script>
  <script src="js/view-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
